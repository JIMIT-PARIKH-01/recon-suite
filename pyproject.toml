[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-suite"
version = "1.0.0"
description = "Recon suite: port scanner, header analyzer, subdomain enum, pipeline"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Jimit Devangkumar Parikh" }]

[project.urls]
Homepage = "https://github.com/JIMIT-PARIKH-01/recon-suite"

[project.scripts]
recon = "recon_suite.cli:main"

[tool.setuptools]
packages = ["recon_suite"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
